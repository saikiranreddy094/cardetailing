<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Elite Detailing</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-main">

    <div class="row g-0 min-vh-100">
        <div class="col-lg-6 d-none d-lg-flex flex-column justify-content-end p-5 auth-split-image-col">
            <div class="position-relative z-2 mb-4" style="max-width: 500px;">
                <h1 class="display-5 mb-3">Begin Your Build.</h1>
                <p class="lead mb-0">
                    Secure your build slot, access daily macro-photography updates, view coating warranties, and manage your vehicle portfolio.
                </p>
            </div>
        </div>

        <div class="col-lg-6 d-flex flex-column bg-main position-relative">
            
            <div class="w-100 d-flex justify-content-end gap-2 p-3 p-md-4">
                <button class="btn btn-sm bg-main border theme-toggle-btn shadow-sm d-flex align-items-center justify-content-center" style="width: 36px; height: 36px;" aria-label="Toggle Theme">
                    <i class="bi bi-moon-fill theme-icon-element text-muted"></i>
                </button>
                <button class="btn btn-sm bg-alt border shadow-sm rtl-toggle-btn fw-bold text-muted px-2" aria-label="Toggle RTL">RTL
</button>
            </div>

            <div class="m-auto w-100 px-4 pb-4 px-md-5 pb-md-5 auth-split-form-wrapper">
                
                <div class="text-center mb-5">
                    <a href="index.html" class="text-decoration-none d-flex align-items-center justify-content-center gap-2 mb-2">
                        <img src="images/generated-image-371222529.webp" alt="Elite Detailing Logo" height="50" class="hover-scale">
                        <h2 class="fw-bold text-main logo-text mb-0 auth-split-title">Elite Cars.</h2>
                    </a>
                    <span class="text-muted text-uppercase fw-bold tracking-wider auth-split-subtitle mt-1 d-block">Client Registration</span>
                </div>

                <form>
                    <div class="row g-3 mb-3">
                        <div class="col-sm-6">
                            <label for="regFirstName" class="form-label small fw-bold mb-1">First Name</label>
                            <input type="text" class="form-control py-2 shadow-none" id="regFirstName" placeholder="John" required>
                        </div>
                        <div class="col-sm-6">
                            <label for="regLastName" class="form-label small fw-bold mb-1">Last Name</label>
                            <input type="text" class="form-control py-2 shadow-none" id="regLastName" placeholder="Doe" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="regEmail" class="form-label small fw-bold mb-1">Email Address</label>
                        <input type="email" class="form-control py-2 shadow-none" id="regEmail" placeholder="name@example.com" required>
                    </div>

                    <div class="mb-3">
                        <div class="d-flex justify-content-end mb-1">
                            <label class="form-label small mb-0">Secure Password</label>
                        </div>
                        <div class="position-relative">
                            <input type="password" class="form-control bg-transparent pe-5" placeholder="********" id="signupPassword">
                            <i class="bi bi-eye position-absolute text-muted password-eye-icon"style="top: 50%; transform: translateY(-50%); cursor: pointer; z-index: 5;"id="toggleSignupPassword"></i>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <div class="d-flex justify-content-end mb-1">
                            <label class="form-label small mb-0">Confirm Password</label>
                        </div>
                        
                        <div class="position-relative">
                            <input type="password" class="form-control bg-transparent pe-5" placeholder="********" id="confirmPassword">
                            <i class="bi bi-eye position-absolute text-muted password-eye-icon"style="top: 50%; transform: translateY(-50%); cursor: pointer; z-index: 5;"id="toggleConfirmPassword"></i>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-secondary-custom w-100 py-3 fw-bold text-uppercase tracking-wider shadow-sm mb-4 auth-split-submit">
                        Create Account
                    </button>

                    <div class="d-flex align-items-center mb-4">
                        <hr class="flex-grow-1 text-muted opacity-25">
                        <span class="mx-3 text-muted text-uppercase fw-bold divider-text">Or continue with</span>
                        <hr class="flex-grow-1 text-muted opacity-25">
                    </div>

                    <div class="d-flex gap-2 mb-4">
                        <button type="button" class="btn bg-main social-btn flex-grow-1 py-2 fw-bold fs-5 shadow-sm rounded-3"><i class="bi bi-google"></i></button>
                        <button type="button" class="btn bg-main social-btn flex-grow-1 py-2 fw-bold fs-5 shadow-sm rounded-3"><i class="bi bi-facebook"></i></button>
                        <button type="button" class="btn bg-main social-btn flex-grow-1 py-2 fw-bold fs-5 shadow-sm rounded-3"><i class="bi bi-twitter-x"></i></button>
                    </div>

                    <div class="text-center">
                        <span class="small text-muted">Already have an account? <a href="login.html" class="text-secondary fw-bold text-decoration-none border-bottom border-secondary pb-1">Sign in here</a></span>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const htmlElement = document.documentElement;
            const themeToggleBtns = document.querySelectorAll('.theme-toggle-btn');
            const rtlToggleBtns = document.querySelectorAll('.rtl-toggle-btn');
            const savedTheme = localStorage.getItem('elite_theme') || 'light';
            htmlElement.setAttribute('data-theme', savedTheme);
            updateThemeIcons(savedTheme);

            themeToggleBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const currentTheme = htmlElement.getAttribute('data-theme');
                    const newTheme = currentTheme === 'light' ? 'dark' : 'light';
                    htmlElement.setAttribute('data-theme', newTheme);
                    localStorage.setItem('elite_theme', newTheme);
                    updateThemeIcons(newTheme);
                });
            });

            function updateThemeIcons(theme) {
                const themeIcons = document.querySelectorAll('.theme-icon-element');
                themeIcons.forEach(icon => {
                    if (theme === 'dark') {
                        icon.classList.remove('bi-moon-fill', 'text-muted');
                        icon.classList.add('bi-sun-fill', 'text-warning');
                    } else {
                        icon.classList.remove('bi-sun-fill', 'text-warning');
                        icon.classList.add('bi-moon-fill', 'text-muted');
                    }
                });
            }
            
            const savedDir = localStorage.getItem('elite_dir') || 'ltr';
            htmlElement.setAttribute('dir', savedDir);
            rtlToggleBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const currentDir = htmlElement.getAttribute('dir');
                    const newDir = currentDir === 'ltr' ? 'rtl' : 'ltr';
                    htmlElement.setAttribute('dir', newDir);
                    localStorage.setItem('elite_dir', newDir);
                });
            });

            document.querySelectorAll('.toggle-password').forEach(toggle => {
                toggle.addEventListener('click', function() {
                    const input = this.previousElementSibling;
                    const icon = this.querySelector('i');
                    if (input.type === 'password') {
                        input.type = 'text';
                        icon.classList.remove('bi-eye');
                        icon.classList.add('bi-eye-slash');
                    } else {
                        input.type = 'password';
                        icon.classList.remove('bi-eye-slash');
                        icon.classList.add('bi-eye');
                    }
                });
            });
        });
    </script>
    <script>
    document.addEventListener("DOMContentLoaded", function() {
        // Find every eye icon on the page
        const togglePasswordIcons = document.querySelectorAll('.password-eye-icon');

        togglePasswordIcons.forEach(function(icon) {
            icon.addEventListener('click', function() {
                // Find the exact input field that sits next to the clicked icon
                const inputField = this.parentElement.querySelector('input');
                
                if (inputField) {
                    // Toggle the type between 'password' (hidden) and 'text' (visible)
                    if (inputField.type === 'password') {
                        inputField.type = 'text';
                        // Change the icon to a slashed eye
                        this.classList.remove('bi-eye');
                        this.classList.add('bi-eye-slash');
                    } else {
                        inputField.type = 'password';
                        // Change the icon back to a normal eye
                        this.classList.remove('bi-eye-slash');
                        this.classList.add('bi-eye');
                    }
                }
            });
        });
    });
</script>
</body>
</html>
