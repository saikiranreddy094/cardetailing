<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - Elite Cars.</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="coming-soon-wrapper d-flex flex-column min-vh-100">

    <div class="w-100 p-4 p-md-5 d-flex justify-content-between align-items-center z-3">
        <a class="d-inline-flex align-items-center text-decoration-none hover-scale brand-link" href="index.html">
            <img src="images/generated-image-371222529.webp" alt="Elite Cars Logo" height="40" class="me-2 flex-shrink-0">
            <span class="logo-text fw-bold fs-4 text-main text-nowrap">Elite Cars.</span>
        </a>
        
        <div class="d-flex gap-2">
            <button class="btn btn-sm bg-alt border shadow-sm theme-toggle-btn" aria-label="Toggle Dark Mode">
                <i class="bi bi-moon-fill theme-icon-element text-muted"></i>
            </button>
            <button class="btn btn-sm bg-alt border shadow-sm rtl-toggle-btn fw-bold text-muted px-2" aria-label="Toggle RTL">
                RTL
            </button>
        </div>
    </div>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center text-center px-3 py-4 z-2">
        <div style="max-width: 600px;">
            
            <span class="badge bg-secondary text-dark text-uppercase tracking-wider px-3 py-2 rounded-pill mb-4 shadow">Under Construction</span>
            
            <h1 class="display-3 fw-bold mb-3 coming-soon-title text-main">Something <span style="color: var(--secondary-color);">Incredible</span> is Coming.</h1>
            
            <p class="lead mb-5 text-muted">
                We are currently engineering a brand new experience for our clients. Drop your email below to get VIP access the moment we launch.
            </p>

            <form class="coming-soon-form mb-5">
                <div class="d-flex flex-column flex-sm-row gap-2 justify-content-center">
                    <input type="email" class="form-control form-control-lg px-4 shadow-sm" placeholder="Enter your email address..." required style="max-width: 400px; margin: 0 auto;">
                    <button class="btn btn-secondary-custom btn-lg fw-bold px-4 px-md-5 text-uppercase tracking-wider flex-shrink-0 shadow-sm" type="submit">Notify Me</button>
                </div>
            </form>

            <div class="d-flex justify-content-center gap-3">
                <a href="#" class="social-link-circle text-decoration-none shadow-sm"><i class="bi bi-instagram fs-5"></i></a>
                <a href="#" class="social-link-circle text-decoration-none shadow-sm"><i class="bi bi-twitter-x fs-5"></i></a>
                <a href="#" class="social-link-circle text-decoration-none shadow-sm"><i class="bi bi-youtube fs-5"></i></a>
            </div>

        </div>
    </main>

    <div class="w-100 p-4 p-md-5 text-center text-md-end mt-auto z-3">
        <a href="index.html" class="text-main opacity-75 text-decoration-none fw-bold small hover-scale d-inline-block">
            <i class="bi bi-arrow-left me-1"></i> Back to Home
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const htmlElement = document.documentElement;
            const themeToggleBtns = document.querySelectorAll('.theme-toggle-btn');
            const rtlToggleBtns = document.querySelectorAll('.rtl-toggle-btn');
            
            // Set initial theme
            const savedTheme = localStorage.getItem('elite_theme') || 'dark'; // Defaulting to dark for visual impact
            htmlElement.setAttribute('data-theme', savedTheme);
            updateThemeIcons(savedTheme);

            // Theme toggle listener
            themeToggleBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const currentTheme = htmlElement.getAttribute('data-theme');
                    const newTheme = currentTheme === 'light' ? 'dark' : 'light';
                    htmlElement.setAttribute('data-theme', newTheme);
                    localStorage.setItem('elite_theme', newTheme);
                    updateThemeIcons(newTheme);
                });
            });

            // Update icon visuals
            function updateThemeIcons(theme) {
                const themeIcons = document.querySelectorAll('.theme-icon-element');
                themeIcons.forEach(icon => {
                    if (theme === 'dark') {
                        icon.classList.remove('bi-moon-fill', 'text-muted');
                        icon.classList.add('bi-sun-fill', 'text-warning');
                    } else {
                        icon.classList.remove('bi-sun-fill', 'text-warning');
                        icon.classList.add('bi-moon-fill', 'text-muted');
                    }
                });
            }
            
            // RTL setup
            const savedDir = localStorage.getItem('elite_dir') || 'ltr';
            htmlElement.setAttribute('dir', savedDir);
            
            rtlToggleBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const currentDir = htmlElement.getAttribute('dir');
                    const newDir = currentDir === 'ltr' ? 'rtl' : 'ltr';
                    htmlElement.setAttribute('dir', newDir);
                    localStorage.setItem('elite_dir', newDir);
                });
            });
        });
    </script>
</body>
</html>
